  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:900;font-size:11px;color:#0A1209;
  background:var(--pc,var(--grey));
}
.rate-stars{
  position:relative;font-size:22px;line-height:1;cursor:pointer;user-select:none;
  letter-spacing:3px;color:rgba(242,245,236,.15);
}
.rate-fill{
  position:absolute;inset:0;overflow:hidden;white-space:nowrap;width:0;
  color:#E8C34A;pointer-events:none;transition:width .12s ease;
  text-shadow:0 0 12px rgba(232,195,74,.35);
}
.rate-val{font-size:12.5px;color:var(--bone-dim);font-style:normal;min-width:24px;}
.rate-avg{
  font-family:"sztos-variable","Inter",sans-serif;font-variation-settings:"wght" 640,"wdth" 106;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#E8C34A;margin-top:3px;
}

/* la etiqueta del libro que están leyendo AHORA: vidrio oscuro con un
   punto ámbar que late — nada de pill verde */
.hc-now{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:7px;
  font-family:"sztos-variable","Inter",sans-serif;font-variation-settings:"wght" 640,"wdth" 106;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  color:var(--bone);background:rgba(7,13,6,.88);
  border:1px solid rgba(232,195,74,.35);border-radius:999px;padding:5px 12px 5px 10px;
  backdrop-filter:blur(8px);box-shadow:0 8px 20px -8px rgba(0,0,0,.8);
}
.hc-now::before{
  content:'';width:6px;height:6px;border-radius:50%;flex:none;
  background:#E8C34A;box-shadow:0 0 8px rgba(232,195,74,.9);
  animation:nowPulse 2.2s ease-in-out infinite;
}
@keyframes nowPulse{50%{opacity:.3;}}
.hc-r{color:#E8C34A;letter-spacing:.04em;margin-left:6px;}
/* la ceremonia del final: estrellas grandes, una fila por cabeza */
.fin-rows{display:flex;flex-direction:column;gap:18px;margin-top:8px;}
.fin-row{display:flex;align-items:center;gap:18px;justify-content:center;}
.fin-name{
  font-family:"sztos-variable","Inter",sans-serif;font-variation-settings:"wght" 680,"wdth" 106;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;min-width:74px;text-align:right;
}
.rate-stars.big{font-size:40px;letter-spacing:6px;}
.rate-val.big{font-size:19px;min-width:44px;color:var(--bone);}
.fin-btn{width:100%;margin:2px 0 16px;}
/* la línea de tiempo del libro */
.tl{position:relative;margin-top:4px;}
.tl::before{content:'';position:absolute;left:14px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg, var(--border), rgba(30,61,38,.15));}
.tl-item{position:relative;display:flex;gap:13px;padding:7px 0;align-items:flex-start;}
.tl-dot{
  position:relative;z-index:2;flex:none;width:30px;height:30px;border-radius:50%;
  background:var(--card-hi);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
.tl-body{padding-top:4px;min-width:0;}
.tl-main{font-size:13.5px;color:var(--bone);line-height:1.35;}
.tl-main b{color:var(--amber-soft);font-weight:600;}
.tl-sub{font-size:11px;color:var(--grey);margin-top:2px;letter-spacing:.03em;}
/* lápiz de edición */
.pl2-pencil{
  background:none;border:1px solid var(--border);color:var(--grey);
  width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;
  transition:.2s;flex:none;
}
.pl2-pencil:hover{border-color:var(--amber);color:var(--amber);}
.pl2-edit{display:flex;flex-direction:column;gap:7px;}
.pl2-edit label{display:flex;flex-direction:column;gap:2px;}
.pl2-edit label b{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);font-weight:600;}
.pl2-edit input{
  background:var(--bg-soft);border:1px solid var(--border);color:var(--bone);
  border-radius:8px;padding:6px 10px;font-family:'Inter';font-size:12.5px;outline:none;
}
.pl2-edit input:focus{border-color:var(--amber);}
.tl-n{color:var(--grey);font-size:10px;letter-spacing:.08em;}
.pl2-exp{display:none;}
@media (max-width:980px){
  .pl2-frame{width:100%;}
  .pl2-view{max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* mobile estilo Criterion: portada grande + tarjeta que se abre con la flechita */
  .placard2{display:flex;flex-direction:column;gap:0;padding:4px 0 0;}
  .pl2-book{order:1;min-height:340px;margin-bottom:10px;}
  /* la barra del título: se toca la flechita para desplegar */
  .pl2-pill{order:2;width:100%;max-width:none;margin:0;justify-self:stretch;
    border-radius:20px;padding:14px 14px 14px 18px;box-shadow:0 -14px 44px -22px rgba(0,0,0,.9);}
  .pl2-exp{display:flex;align-items:center;justify-content:center;flex:none;
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
    background:rgba(20,34,22,.85);color:var(--bone);font-size:20px;line-height:1;
    cursor:pointer;transition:transform .32s var(--ease-pop);}
  /* paneles (sinopsis + historial): parte de la misma hoja cuando se abre */
  .pl2-panel{order:3;width:100%;max-height:none;overflow:visible;box-shadow:none;
    border:none;border-radius:0;padding:20px;
    background:linear-gradient(180deg, rgba(12,20,13,.97), rgba(7,12,8,.98));}
  .pl2-left{order:3;padding-top:22px;}
  .pl2-right{order:4;border-top:1px solid rgba(30,61,38,.4);
    border-radius:0 0 20px 20px;border-bottom:1px solid var(--border-soft);padding-bottom:28px;}
  .pl2-right .pl2-h{margin-top:0;font-size:11px;color:var(--amber-soft);}
  .pl2-syn{font-size:16px;line-height:1.72;}
  /* colapsado por defecto: solo portada + barra de título */
  .placard2:not(.pl2-open) .pl2-left,
  .placard2:not(.pl2-open) .pl2-right{display:none;}
  /* abierto: la barra se pega a la hoja y la flechita gira */
  .placard2.pl2-open .pl2-pill{border-radius:20px 20px 0 0;}
  .placard2.pl2-open .pl2-exp{transform:rotate(180deg);}
  .pl2-arrow.prev{left:2px;} .pl2-arrow.next{right:2px;}
}
.pl-link{display:inline-flex;align-items:center;gap:7px;margin-top:18px;font-size:13px;color:var(--amber);text-decoration:none;border:1px solid rgba(201,248,57,.3);border-radius:999px;padding:9px 18px;transition:.2s;}
.pl-link:hover{background:rgba(201,248,57,.1);border-color:var(--amber);}
.pl-dots{display:flex;gap:6px;justify-content:center;margin-top:16px;}
.pl-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:.2s;}
.pl-dot.act{background:var(--amber);width:20px;border-radius:4px;}

/* X escondida para borrar un libro (aparece solo cerca de la esquina) */
.del-x{
  position:absolute;top:-9px;right:-9px;z-index:40;
  width:22px;height:22px;border-radius:50%;
  background:var(--danger);color:#fff;border:none;cursor:pointer;
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.5);transition:.18s var(--ease-pop);
  box-shadow:0 4px 10px rgba(0,0,0,.5);
}
.del-x.peek{opacity:1;transform:scale(1);}

/* borrar desde adentro de la ficha (bóveda) */
.pl2-del{margin-top:22px;width:100%;background:none;border:none;
  color:var(--grey);font-family:'Inter';font-size:12px;letter-spacing:.03em;
  padding:8px;cursor:pointer;opacity:.55;transition:.2s;}
.pl2-del:hover{opacity:1;color:var(--danger);}
/* marcador que cuenta hacia arriba en las pantallas de cierre */
.mk-num{font-variant-numeric:tabular-nums;display:inline-block;min-width:.7em;text-align:center;}
.mk-pop{animation:winPop .5s var(--ease-pop);}
/* ADN interactivo: listita de libros por trope */
#adnChips .st-chip[data-trope]{cursor:pointer;transition:.16s;}
#adnChips .st-chip[data-trope]:hover,#adnChips .st-chip.on{border-color:var(--amber);color:var(--bone);}
.st-adn-pop{max-height:0;overflow:hidden;transition:max-height .34s ease, margin .34s ease;margin-top:0;
  display:flex;flex-wrap:wrap;gap:6px 16px;}
.st-adn-pop.on{max-height:520px;margin-top:14px;}
.st-adn-h{flex-basis:100%;font-family:'Inter';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:2px;}
.st-adn-pop span{font-family:'Fraunces',serif;font-size:13.5px;color:var(--bone-dim);}

/* bóveda en modo LISTA */
.vault-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.vl-row{display:flex;align-items:center;gap:14px;padding:9px 12px;cursor:pointer;transition:.18s;
  border:1px solid var(--border-soft);border-radius:14px;
  background:linear-gradient(165deg,rgba(15,25,16,.7),rgba(7,12,8,.82));}
.vl-row:hover{border-color:var(--amber);transform:translateX(2px);}
.vl-cover{width:44px;height:64px;border-radius:5px;flex:none;background-size:cover;background-position:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);}
.vl-body{flex:1;min-width:0;}
.vl-title{font-family:'Fraunces',serif;font-weight:700;font-size:16px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vl-meta{font-size:12px;color:var(--bone-dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vl-badge{flex:none;font-size:11px;color:var(--amber);letter-spacing:.06em;}

/* botones de carga en el home */
.home-load{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;
}
.load-btn{
  font-size:12.5px;color:var(--bone-dim);background:var(--card);
  border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;
  font-family:'Inter';transition:.2s;display:inline-flex;align-items:center;gap:7px;
}
.load-btn:hover{border-color:var(--amber);color:var(--bone);}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}

/* botón reset / borrar memoria */
#resetBtn{
  position:fixed;bottom:14px;left:14px;z-index:8000;
  background:rgba(7,13,6,.6);border:1px solid var(--border-soft);color:var(--grey);
  border-radius:999px;padding:7px 13px;font-size:11px;cursor:pointer;font-family:'Inter';
  backdrop-filter:blur(8px);transition:.2s;opacity:.5;
}
#resetBtn:hover{opacity:1;border-color:var(--danger);color:var(--danger);}

/* abandonar la cosecha en curso (solo visible durante una partida) */
#abortBtn{
  position:fixed;bottom:14px;right:14px;z-index:8000;
  background:rgba(7,13,6,.6);border:1px solid var(--border-soft);color:var(--grey);
  border-radius:999px;padding:7px 13px;font-size:11px;cursor:pointer;font-family:'Inter';
  backdrop-filter:blur(8px);transition:.2s;opacity:.5;display:none;
}
#abortBtn.on{display:block;}
#abortBtn:hover{opacity:1;border-color:var(--bone-dim);color:var(--bone);}

/* ============================================================
   VASALLAJE — torneo de la bóveda
   ============================================================ */
.vs-sub{font-size:12px;color:var(--grey);margin-top:10px;letter-spacing:.04em;}

/* selección 6+6: bandeja de elegidos */
.vs-tray{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  min-height:86px;margin-top:18px;padding:14px 18px;
  border:1.5px dashed var(--border);border-radius:16px;
  transition:border-color .3s;
}
.vs-tray.full{border-color:var(--amber);border-style:solid;}
.vs-tray .vs-slot-mini{
  cursor:pointer;position:relative;
  animation:rescueIn .5s var(--ease-pop);
  transition:transform .2s;
}
.vs-tray .vs-slot-mini:hover{transform:translateY(-4px);}
.vs-tray .vs-slot-mini::after{
  content:'✕';position:absolute;top:-7px;right:-7px;
  width:17px;height:17px;border-radius:50%;background:var(--danger);color:#fff;
  font-size:10px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.2s;
}
.vs-tray .vs-slot-mini:hover::after{opacity:1;}
.vs-count{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--amber);}
/* libro tomado: se desvanece hacia adelante y queda su HUECO en el estante */
.vault-slot .book-scene{transition:opacity .38s ease;}
.vault-slot.vs-taken .book3d{
  transform:translate3d(12px, -30px, 100px) rotateY(16deg);
}
.vault-slot.vs-taken .book-scene{opacity:0;pointer-events:none;}
.vault-slot.vs-taken .vb-under{opacity:0;}
.vault-slot.vs-taken::after{ /* el hueco cálido que deja el libro */
  content:'';position:absolute;left:3px;right:3px;top:10px;bottom:0;
  border-radius:5px 5px 2px 2px;
  background:linear-gradient(180deg, rgba(2,4,2,.72), rgba(8,10,6,.4) 60%, rgba(20,16,10,.28));
  box-shadow:inset 0 6px 14px rgba(0,0,0,.7), inset 3px 0 6px rgba(0,0,0,.35), inset -3px 0 6px rgba(0,0,0,.35);
  animation:fadeIn .5s ease;
}
.vault-slot.vs-taken::before{ /* el punto del dueño, sobre el hueco */
  content:'';position:absolute;top:26px;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--pc,var(--amber));z-index:50;
  box-shadow:0 0 9px var(--pc,var(--amber));
  animation:fadeIn .6s ease;
}
.vault-slot.vs-locked{pointer-events:none;}

/* ---- el bracket ---- */
.vs-stage-wrap{width:100%;display:flex;justify-content:center;overflow:hidden;margin-top:6px;}
.vs-stage{position:relative;width:1060px;height:560px;transform-origin:top center;flex:none;}
.vs-svg{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.vs-svg .base{stroke:rgba(242,245,236,.13);stroke-width:1.6;fill:none;}
.vs-svg .lit{
  stroke:#E8C34A;stroke-width:2.4;fill:none;
  filter:drop-shadow(0 0 5px rgba(232,195,74,.75));
  stroke-linecap:round;
}
.vs-svg .dim{stroke:rgba(140,150,140,.22);stroke-width:1.8;fill:none;}
.vs-svg .dot{fill:#E8C34A;filter:drop-shadow(0 0 4px rgba(232,195,74,.8));}
.vs-svg .dot-off{fill:rgba(242,245,236,.2);}
.vs-node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:.4s;
}
.vs-node .vsn-cover{
  width:58px;height:87px;border-radius:4px;overflow:hidden;position:relative;
  background:var(--card-hi);box-shadow:0 8px 18px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
}
.vs-node .vsn-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.vs-node .vsn-lab{
  font-size:9px;color:var(--bone-dim);max-width:112px;text-align:center;
  line-height:1.15;letter-spacing:.02em;
}
.vs-node.empty .vsn-cover{background:rgba(20,42,26,.5);border:1.5px dashed var(--border);box-shadow:none;}
.vs-node.clickable{cursor:pointer;}
.vs-node.clickable .vsn-cover{animation:vsPulse 1.6s ease-in-out infinite;}
@keyframes vsPulse{0%,100%{box-shadow:0 6px 14px rgba(0,0,0,.55), 0 0 0 1px rgba(232,195,74,.35);}50%{box-shadow:0 6px 18px rgba(0,0,0,.6), 0 0 14px 2px rgba(232,195,74,.55);}}
.vs-node.out{filter:grayscale(.9) brightness(.5);}
.vs-node.out .vsn-lab{color:var(--grey);}
.vs-node.champ .vsn-cover{width:100px;height:150px;border-radius:6px;}
.vs-node.pop{animation:vsPop .5s var(--ease-pop);}
@keyframes vsPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}60%{transform:translate(-50%,-50%) scale(1.12);}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.vs-trophy{
  position:absolute;transform:translate(-50%,-50%);text-align:center;
  font-size:44px;filter:drop-shadow(0 0 18px rgba(232,195,74,.7));
  animation:vsTrophy 2.4s ease-in-out infinite;pointer-events:none;
}
@keyframes vsTrophy{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.08);}}
.vs-side-tag{
  position:absolute;transform:translate(-50%,-50%);
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--grey);
}
.vs-phase{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);
  min-height:1.4em;margin-top:8px;text-align:center;
}

/* ---- debate / dado ---- */
/* el alegato: dos columnas de filas fijas para que todo quede a la misma altura */
.vs-duel{
  --dcH:182px;                                  /* alto de la fila de la tapa */
  display:flex;align-items:flex-start;justify-content:center;
  gap:clamp(14px,3vw,38px);
}
.vs-duel-side{display:flex;flex-direction:column;align-items:center;width:238px;max-width:38vw;}
.vs-duel-owner{
  height:15px;line-height:15px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.vs-duel-cover{height:var(--dcH);margin-top:9px;display:flex;align-items:center;justify-content:center;}
.vs-duel-title{
  font-family:'Fraunces',serif;font-weight:700;font-size:16px;text-align:center;
  line-height:1.25;min-height:2.5em;margin-top:12px;
  display:flex;align-items:center;justify-content:center;
}
.vs-duel-tropes{
  /* alto de dos filas de pills: los tropes largos saltan de línea sin correr la sinopsis */
  height:47px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-start;
  overflow:hidden;margin-top:5px;
}
.vs-duel-tropes span{
  font-size:9.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--border);color:var(--grey);white-space:nowrap;
}
.vs-duel-tropes span.on{border-color:rgba(232,195,74,.5);color:#E8C34A;background:rgba(232,195,74,.07);}
.vs-duel-go{margin-top:16px;}
.vs-duel-meta{font-size:11px;color:var(--amber-soft);letter-spacing:.02em;margin-top:4px;}
.vs-duel:not(.epic) .vs-duel-side.right .vs-duel-meta{text-align:right;}
/* el «vs» clavado en el centro de las tapas, no colgando abajo */
.vs-vs{
  flex:none;font-family:'Fraunces',serif;font-size:40px;font-weight:900;color:#E8C34A;
  text-shadow:0 0 20px rgba(232,195,74,.5);line-height:1;
  margin-top:calc(15px + 9px + var(--dcH)/2 - .5em);
}
.vs-flavor{font-style:italic;color:var(--grey);font-size:13px;text-align:center;max-width:420px;}
.vs-die{
  font-size:clamp(70px,14vw,110px);line-height:1;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));
}
.vs-die.rolling{animation:dieRoll .12s linear infinite;}
@keyframes dieRoll{0%{transform:rotate(-8deg) translateY(0);}50%{transform:rotate(6deg) translateY(-8px);}100%{transform:rotate(-8deg) translateY(0);}}
.vs-die-map{display:flex;gap:26px;justify-content:center;font-size:13px;color:var(--bone-dim);}
.vs-die-map b{color:var(--bone);}

/* ---- el cajón del regreso ---- */
.vs-drawer-zone{position:relative;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px;}
.vs-flyers{position:absolute;inset:0;pointer-events:none;}
.vs-flyer{position:absolute;width:96px;height:144px;border-radius:6px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.7);background:var(--card-hi);}
.vs-flyer img{width:100%;height:100%;object-fit:cover;}
.vs-drawer{
  position:relative;width:min(430px,84vw);height:150px;flex:none;
  transition:transform .12s;
}
.vs-drawer .dw-box{
  position:absolute;inset:22px 0 0;
  background:linear-gradient(180deg, var(--wood-3) 0%, var(--wood-1) 30%, var(--wood-2) 100%);
  border-radius:10px;
  box-shadow:inset 0 3px 4px rgba(255,255,255,.12), inset 0 -12px 24px rgba(0,0,0,.5), 0 26px 50px -18px rgba(0,0,0,.85);
}
.vs-drawer .dw-mouth{
  position:absolute;top:0;left:6%;right:6%;height:34px;
  background:radial-gradient(60% 100% at 50% 100%, #020402, #0B0E08 80%);
  border-radius:10px 10px 4px 4px;
  box-shadow:inset 0 6px 14px rgba(0,0,0,.95);
  transition:height .5s var(--ease-pop), top .5s var(--ease-pop);
}
.vs-drawer.closed .dw-mouth{height:5px;top:20px;}
.vs-drawer .dw-handle{
  position:absolute;bottom:38px;left:50%;transform:translateX(-50%);
  width:74px;height:12px;border-radius:8px;background:linear-gradient(180deg,#8a6a3a,#4a3418);
  box-shadow:0 3px 5px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.35);
}
.vs-drawer.bump{animation:dwBump .18s ease;}
@keyframes dwBump{0%{transform:scale(1);}40%{transform:scale(1.025) translateY(2px);}100%{transform:scale(1);}}
.vs-drawer.slam{animation:dwSlam .5s var(--ease-pop);}
@keyframes dwSlam{0%{transform:translateY(-8px);}55%{transform:translateY(3px) scaleY(.96);}100%{transform:none;}}

/* botón secundario del home */
.vasallaje-cta{margin-top:14px;opacity:0;animation:rise .6s var(--ease-out) forwards;animation-delay:.34s;}
.vasallaje-cta .btn{font-size:13px;padding:11px 24px;color:var(--bone-dim);}
.vasallaje-cta .btn:hover{color:var(--bone);}
.vasallaje-note{font-size:11px;color:var(--grey);margin-top:7px;text-align:center;}

/* ============================================================
   MINIJUEGOS TANDA 3
   ============================================================ */
/* --- 🛗 el ascensor --- */
.asc{position:relative;width:min(460px,90vw);}
.asc-shaft{position:relative;height:380px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#141518,#0b0c0e);border:1px solid #000;
  box-shadow:inset 0 0 40px rgba(0,0,0,.8);}
.asc-cabin{position:absolute;left:8%;right:8%;top:12%;bottom:14%;
  background:linear-gradient(180deg,#3a3d42,#26282c);border-radius:8px;
  border:2px solid #101114;box-shadow:inset 0 2px 3px rgba(255,255,255,.12), 0 14px 30px rgba(0,0,0,.6);}
.asc-cabin.shaking{animation:ascShake .18s linear infinite;}
@keyframes ascShake{0%{transform:translate(0,0);}25%{transform:translate(1px,-1px);}50%{transform:translate(-1px,1px);}75%{transform:translate(1px,1px);}100%{transform:translate(0,0);}}
.asc-doors{position:absolute;inset:0;display:flex;z-index:5;border-radius:6px;overflow:hidden;}
.asc-door{flex:1;background:linear-gradient(90deg,#4a4e55,#33363c 60%,#4a4e55);transition:transform 1s ease;
  border-right:1px solid #0c0d0f;}
.asc.open .asc-door.l{transform:translateX(-101%);}
.asc.open .asc-door.r{transform:translateX(101%);}
.asc-inside{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;
  gap:6px;padding:14px;background:linear-gradient(180deg,rgba(255,240,200,.06),transparent);}
.asc-panel{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:14px;}
.asc-floor{font-family:'Oswald','Inter';font-size:30px;font-weight:600;color:#FF9B3D;
  background:#160e04;border-radius:8px;padding:5px 16px;letter-spacing:.1em;
  box-shadow:inset 0 0 12px rgba(255,155,61,.35);text-shadow:0 0 10px rgba(255,155,61,.8);}
.asc-sign{font-family:'Oswald','Inter';font-size:13px;letter-spacing:.18em;color:#3a1512;
  background:#1c0a08;border-radius:8px;padding:8px 14px;border:1px solid #3a1210;transition:.2s;}
.asc-sign.on{color:#fff;background:#C0392B;animation:signBlink .4s step-end infinite;box-shadow:0 0 22px rgba(224,80,60,.8);}
@keyframes signBlink{50%{background:#7a1810;box-shadow:none;}}
.asc-suite{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity 1.2s;
  background:radial-gradient(80% 90% at 50% 30%, rgba(255,215,120,.5), rgba(120,90,20,.15) 70%);}
.asc.suite .asc-suite{opacity:1;}
.asc-eject{animation:ascEject .8s ease forwards !important;}
@keyframes ascEject{0%{transform:translate(0,0) rotate(0);}100%{transform:translate(-260px,120px) rotate(-50deg);opacity:0;}}

/* --- 🧲 la garra --- */
.claw-cab{position:relative;width:min(560px,92vw);height:420px;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#2A1140 0%,#180a26 55%,#0e0616);
  border:6px solid #E84393;box-shadow:0 0 0 3px #FFD34D, 0 24px 50px -16px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.5);}
.claw-glass{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.06) 42%,transparent 55%);pointer-events:none;}
.claw-rail{position:absolute;top:16px;left:0;right:0;height:8px;background:#0a0a0c;box-shadow:0 2px 0 rgba(255,255,255,.08);}
.claw-unit{position:absolute;top:20px;left:50%;width:0;transition:left 1s ease-in-out;z-index:6;}
.claw-cable{position:absolute;left:-1.5px;top:0;width:3px;height:26px;background:#888;transition:height .9s ease-in-out;}
.claw-hand{position:absolute;left:-22px;width:44px;height:34px;transition:top .9s ease-in-out;top:26px;}
.claw-hand::before,.claw-hand::after{content:'';position:absolute;top:0;width:16px;height:30px;border:5px solid #b8bfc9;border-top:none;transition:transform .3s;}
.claw-hand::before{left:0;border-right:none;border-radius:0 0 0 14px;transform-origin:top right;}
.claw-hand::after{right:0;border-left:none;border-radius:0 0 14px 0;transform-origin:top left;}
.claw-hand.closed::before{transform:rotate(18deg);}
.claw-hand.closed::after{transform:rotate(-18deg);}
.claw-books{position:absolute;left:0;right:0;bottom:10px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 40px;}
.claw-books .mini-book{transition:transform .2s;}
.claw-drop{animation:clawDrop .6s cubic-bezier(.4,0,1,1) forwards;}
@keyframes clawDrop{0%{}60%{transform:translateY(var(--fall,200px));}80%{transform:translateY(calc(var(--fall,200px) - 18px));}100%{transform:translateY(var(--fall,200px));}}
.claw-chute{position:absolute;right:10px;bottom:0;width:74px;height:90px;border-radius:10px 10px 0 0;
  background:rgba(0,0,0,.55);border:2px dashed rgba(255,211,77,.5);display:flex;align-items:flex-end;justify-content:center;
  font-size:9px;color:#FFD34D;letter-spacing:.14em;padding-bottom:6px;}
.claw-marquee{position:absolute;top:-2px;left:0;right:0;text-align:center;font-family:'Bringbold','Fraunces';
  font-size:15px;letter-spacing:.2em;color:#FFD34D;text-shadow:0 0 12px rgba(255,211,77,.7);z-index:8;}

/* --- 🚨 luz verde luz roja --- */
.lr-field{position:relative;width:min(700px,94vw);height:360px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#8FB4D9 0%,#BFD6E8 34%,#C8B98B 35%,#B3A272 100%);}
.lr-bush{position:absolute;top:26%;height:26px;left:0;right:0;
  background:radial-gradient(18px 26px at 10% 100%,#4E6B3A 60%,transparent 61%) 0 0/44px 100% repeat-x;}
.lr-line{position:absolute;top:35%;bottom:0;right:56px;width:5px;background:repeating-linear-gradient(180deg,#fff 0 12px,#C0392B 12px 24px);box-shadow:0 0 10px rgba(0,0,0,.3);}
.lr-doll{position:absolute;right:6px;top:30%;width:46px;text-align:center;transition:transform .35s var(--ease-pop);transform-origin:50% 80%;z-index:5;font-size:38px;line-height:1;}
.lr-doll .head{display:block;transition:transform .3s;}
.lr-doll.watching .head{transform:rotateY(180deg);}
.lr-light{position:absolute;top:10px;left:14px;display:flex;gap:8px;z-index:6;}
.lr-light i{width:20px;height:20px;border-radius:50%;background:#222;display:block;box-shadow:inset 0 2px 3px rgba(0,0,0,.6);}
.lr-light i.g{background:#57C84D;box-shadow:0 0 16px rgba(87,200,77,.9);}
.lr-light i.r{background:#E04A3A;box-shadow:0 0 16px rgba(224,74,58,.9);}
.lr-run{position:absolute;transition:left .32s linear;z-index:3;}
.lr-run .rrb-inner{position:relative;}
.lr-run.walk .mini-book{animation:runnerBob .3s ease-in-out infinite;}
.lr-key{position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  font-family:'Inter';font-weight:700;font-size:13px;color:#0A1209;background:#F2F5EC;
  border-radius:6px;padding:3px 9px;border-bottom:3px solid #9aa39c;
  opacity:0;transition:.2s;z-index:9;}
.lr-key.show{opacity:1;animation:keyPulse .5s ease-in-out infinite;}
.lr-key.ok{background:var(--amber);animation:none;}
@keyframes keyPulse{50%{transform:translateX(-50%) scale(1.12);}}

/* --- 💣 la papa caliente --- */
.pp-ring{position:relative;}
.pp-bomb{position:absolute;z-index:9;font-size:40px;transition:left .28s var(--ease-pop), top .28s var(--ease-pop);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));transform:translate(-50%,-120%);}
/* la chispa de la mecha: va por imagen porque un ::after no lo alcanza el emojificador */
.pp-bomb::after{content:'';position:absolute;top:-12px;right:-8px;width:16px;height:16px;
  background:var(--emo-spark) center/contain no-repeat;animation:fuseSpark .3s linear infinite;}
@keyframes fuseSpark{50%{opacity:.3;transform:scale(.7) rotate(30deg);}}
.pp-boomflash{position:fixed;inset:0;background:rgba(255,150,40,.3);z-index:4000;pointer-events:none;}

/* --- 🚢 el naufragio --- */
.nf-sea{position:relative;width:min(700px,94vw);height:400px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#0a1230 0%,#0d1c42 45%,#081226 100%);}
.nf-stars{position:absolute;inset:0 0 55% 0;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 45%,#fff,transparent),radial-gradient(1px 1px at 40% 60%,#fff,transparent);}
.nf-moon{position:absolute;top:22px;right:44px;width:40px;height:40px;border-radius:50%;background:#EDEDE0;box-shadow:0 0 30px rgba(240,240,220,.5);}
.nf-water{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:4;
  background:linear-gradient(180deg,rgba(20,50,90,.9),rgba(6,16,34,.98));}
.nf-wave{position:absolute;top:-12px;left:-60px;right:-60px;height:24px;opacity:.8;
  background:radial-gradient(26px 15px at 26px 100%,#12305a 70%,transparent 71%) 0 0/52px 100% repeat-x;
  animation:waveMove 3.2s linear infinite;}
@keyframes waveMove{to{transform:translateX(52px);}}
.nf-ship{position:absolute;left:50%;top:26%;width:300px;height:110px;transform:translateX(-50%);z-index:3;transition:2.6s ease-in;}
.nf-hull{position:absolute;bottom:0;left:0;right:0;height:56px;background:linear-gradient(180deg,#2c2f38,#14161c);
  clip-path:polygon(4% 0,96% 0,82% 100%,18% 100%);}
.nf-deck{position:absolute;bottom:52px;left:16%;right:16%;height:26px;background:#3b3f4c;border-radius:4px 4px 0 0;}
.nf-chim{position:absolute;bottom:74px;width:20px;height:34px;background:#B33A2E;border-top:6px solid #1a1a1e;border-radius:2px;}
.nf-ship.sink{transform:translateX(-50%) rotate(16deg) translateY(150px);}
.nf-book{position:absolute;z-index:5;transition:top .5s, left .5s;}
.nf-book .glub{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:12px;opacity:0;}
.nf-book.drowning{animation:drown 1.1s ease-in-out infinite;}
@keyframes drown{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(9px) rotate(5deg);}}
.nf-book.drowning .glub{animation:glubUp 1.4s ease-out infinite;}
@keyframes glubUp{0%{opacity:0;transform:translate(-50%,0);}30%{opacity:1;}100%{opacity:0;transform:translate(-50%,-26px);}}
.nf-book.saved{animation:none;}
.nf-book.gone{animation:sinkAway 2.2s ease-in forwards;}
@keyframes sinkAway{to{transform:translateY(90px) rotate(30deg);opacity:0;filter:brightness(.3) blur(2px);}}
.nf-ring{position:absolute;width:34px;height:34px;border-radius:50%;border:9px solid #E8483B;z-index:8;
  box-shadow:inset 0 0 0 3px #fff, 0 6px 12px rgba(0,0,0,.5);}
.nf-prow{position:absolute;left:50%;bottom:38%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;align-items:flex-end;}
.nf-prow .mini-book{transform:rotate(-10deg);}
.nf-prow .mini-book:last-child{transform:rotate(8deg) translateY(-8px);}
.nf-hearts{position:absolute;font-size:16px;animation:glubUp 1.8s ease-out infinite;}

/* --- 🎈 el globo --- */
.gb-sky{position:relative;width:min(620px,92vw);height:430px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#7FB2E5 0%,#BFD9EE 55%,#DCE9F2 100%);}
.gb-cloud{position:absolute;width:90px;height:26px;border-radius:20px;background:rgba(255,255,255,.85);
  box-shadow:22px -10px 0 6px rgba(255,255,255,.8), -20px -6px 0 2px rgba(255,255,255,.75);
  animation:cloudDrift linear infinite;}
@keyframes cloudDrift{from{transform:translateX(680px);}to{transform:translateX(-200px);}}
.gb-ground{position:absolute;left:-4%;right:-4%;bottom:-40px;height:120px;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#6F955C,#4E6B3A);transition:bottom 1.4s ease;z-index:2;}
.gb-balloon{position:absolute;left:50%;top:36px;transform:translateX(-50%);z-index:5;transition:top 1.6s ease;}
.gb-env{width:150px;height:170px;margin:0 auto;border-radius:50% 50% 46% 46%;
  background:repeating-linear-gradient(90deg,#D95A4E 0 24px,#EFD07A 24px 48px);
  box-shadow:inset -14px -16px 30px rgba(0,0,0,.28), 0 12px 24px rgba(0,0,0,.25);
  animation:balloonSway 5s ease-in-out infinite;}
@keyframes balloonSway{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2.5deg);}}
.gb-basket{width:110px;margin:-6px auto 0;min-height:56px;border-radius:8px;padding:8px 6px 6px;
  background:repeating-linear-gradient(45deg,#8a6437 0 7px,#6d4c26 7px 14px);
  border:2px solid #503618;display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap;
  box-shadow:0 10px 20px rgba(0,0,0,.3);}
.gb-basket .mini-book{cursor:pointer;transition:transform .2s;}
.gb-basket .mini-book:hover{transform:translateY(-6px);}
.gb-alt{position:absolute;top:12px;left:14px;z-index:8;font-family:'Oswald','Inter';font-size:22px;color:#173;
  background:rgba(255,255,255,.85);border-radius:10px;padding:6px 14px;box-shadow:0 6px 14px rgba(0,0,0,.2);color:#1d3a52;}
.gb-alt.low{color:#C0392B;animation:keyPulse .5s ease-in-out infinite;}
.gb-toss{animation:gbToss 1.4s cubic-bezier(.5,0,.9,.5) forwards !important;z-index:9;}
@keyframes gbToss{20%{transform:translateY(-24px) rotate(-15deg);}100%{transform:translateY(430px) rotate(220deg);opacity:.2;}}

/* --- 🕯️ espiritismo --- */
.esp{position:fixed;inset:0;z-index:6000;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;opacity:0;transition:opacity 2s;}
.esp.on{opacity:1;}
.esp-frost{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(180,210,235,.09) 78%, rgba(200,225,245,.16) 100%);}
.esp-table{position:relative;width:min(560px,92vw);height:min(560px,92vw);border-radius:50%;
  background:radial-gradient(circle at 50% 42%, #17110a, #0a0704 62%, #030201 100%);
  box-shadow:inset 0 0 80px #000, 0 0 120px rgba(90,140,190,.06);}
.esp-candle{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);text-align:center;z-index:4;}
.esp-wax{width:26px;height:64px;margin:0 auto;background:linear-gradient(90deg,#101014,#26262e 45%,#0c0c10);border-radius:5px 5px 3px 3px;}
.esp-flame{width:14px;height:26px;margin:0 auto -4px;border-radius:50% 50% 42% 42%;
  background:radial-gradient(circle at 50% 75%, #DFF6FF 0%, #7FC4EF 42%, #2E5F9E 78%, transparent 90%);
  filter:blur(.4px) drop-shadow(0 0 14px rgba(120,180,240,.8));
  animation:espFlick 1.1s ease-in-out infinite;transform-origin:bottom;}
@keyframes espFlick{0%,100%{transform:scale(1) skewX(-3deg);}30%{transform:scale(1.12,.92) skewX(4deg);}60%{transform:scale(.9,1.1) skewX(-5deg);}}
.esp-book{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.4s;}
.esp-mini-candle{width:6px;height:16px;background:#1c1c22;border-radius:2px;position:relative;}
.esp-mini-candle::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:7px;height:11px;border-radius:50% 50% 40% 40%;
  background:radial-gradient(circle at 50% 75%, #DFF6FF, #5E93C9 70%, transparent);
  animation:espFlick 1.3s ease-in-out infinite;}
.esp-book.out .esp-mini-candle::before{display:none;}
.esp-book.poss .rrb-inner{animation:ascShake .09s linear infinite;}
.esp-tar{position:absolute;top:0;width:5px;height:0;background:linear-gradient(#05070a,#000);border-radius:3px;z-index:5;animation:tarDrip 1.6s ease-in forwards;}
@keyframes tarDrip{to{height:88%;}}
.esp-swallow{animation:espSwallow 1s ease-in forwards !important;}
@keyframes espSwallow{to{filter:brightness(0);transform:scale(.55);opacity:0;}}
.esp-hand{position:absolute;z-index:8;width:120px;opacity:0;filter:drop-shadow(0 0 10px rgba(120,170,220,.25));}
.esp-whisper{position:absolute;left:0;right:0;bottom:7%;text-align:center;z-index:9;
  font-family:'Fraunces',serif;font-style:italic;font-size:clamp(15px,2.4vw,22px);
  color:rgba(190,215,235,.65);letter-spacing:.14em;opacity:0;transition:opacity 1.6s;
  text-shadow:0 0 18px rgba(120,170,220,.4);}
.esp-whisper.on{opacity:1;}
.esp-face{position:absolute;inset:8% 14%;z-index:6;border-radius:6px;opacity:0;
  background:radial-gradient(38% 30% at 32% 32%, #000 40%, transparent 42%),
             radial-gradient(38% 30% at 68% 32%, #000 40%, transparent 42%),
             radial-gradient(30% 42% at 50% 74%, #000 45%, transparent 47%),
             radial-gradient(90% 95% at 50% 45%, #DDE7EE 55%, transparent 75%);}
.esp-face.show{animation:faceScream .9s ease-out forwards;}
@keyframes faceScream{0%{opacity:0;transform:scale(.7);}25%{opacity:1;}100%{opacity:0;transform:scale(1.35);}}
/* ouija final */
.esp-ouija{position:relative;width:min(540px,90vw);padding:34px 20px 26px;border-radius:16px;
  background:radial-gradient(circle at 50% 30%, #241a10, #120c06);border:1px solid #3a2a16;
  box-shadow:0 0 60px rgba(120,170,220,.08), inset 0 0 40px rgba(0,0,0,.7);}
.esp-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 11px;}
.esp-letters span{font-family:'Fraunces',serif;font-size:19px;color:#C9A96A;opacity:.75;transition:.15s;width:24px;text-align:center;}
.esp-letters span.hot{color:#EFE0B8;opacity:1;text-shadow:0 0 16px rgba(233,206,138,.9);transform:scale(1.35);}
.esp-plank{position:absolute;width:52px;height:52px;border-radius:50% 50% 60% 60%;z-index:5;pointer-events:none;
  border:3px solid #C9A96A;background:rgba(30,20,10,.4);transition:left .5s var(--ease-pop), top .5s var(--ease-pop);
  box-shadow:0 8px 18px rgba(0,0,0,.6);}
.esp-plank::after{content:'';position:absolute;inset:30%;border-radius:50%;border:2px solid rgba(201,169,106,.7);}
.esp-spell{margin-top:16px;text-align:center;font-family:'Fraunces',serif;font-size:24px;letter-spacing:.3em;color:#EFE0B8;min-height:1.3em;}

/* --- 👽 la abducción --- */
.ab-field{position:relative;width:min(700px,94vw);height:400px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#050916 0%,#0a1226 60%,#0e2415 78%,#143018 100%);}
.ab-stars{position:absolute;inset:0 0 30% 0;
  background:radial-gradient(1.5px 1.5px at 15% 25%,#fff,transparent),radial-gradient(1px 1px at 45% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 75% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 12%,#fff,transparent),radial-gradient(1px 1px at 30% 45%,#fff,transparent);}
.ab-moon{position:absolute;top:26px;left:40px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 62% 40%, transparent 46%, #EDEDD8 50%);}
.ab-grass{position:absolute;left:0;right:0;bottom:0;height:24%;
  background:radial-gradient(14px 20px at 10px 100%,#1E4022 65%,transparent 66%) 0 0/28px 100% repeat-x, #173318;}
.ab-book{position:absolute;bottom:12%;z-index:3;animation:graze 4s ease-in-out infinite;}
@keyframes graze{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-5px) rotate(2deg);}}
.ab-ufo{position:absolute;top:12%;left:-140px;z-index:7;transition:left 1.1s ease-in-out, top .8s ease;}
.ab-dome{width:44px;height:26px;margin:0 auto -8px;border-radius:50% 50% 0 0;
  background:radial-gradient(circle at 40% 30%, rgba(180,240,255,.9), rgba(70,140,190,.5));}
.ab-disc{width:120px;height:30px;border-radius:50%;
  background:linear-gradient(180deg,#9aa8b8,#4d5a68 60%,#2b333d);
  box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.5);position:relative;}
.ab-disc i{position:absolute;bottom:4px;width:9px;height:9px;border-radius:50%;background:#79E0FF;
  box-shadow:0 0 10px #79E0FF;animation:ufoLights 1s linear infinite;}
.ab-disc i:nth-child(1){left:14%;} .ab-disc i:nth-child(2){left:45%;animation-delay:.33s;} .ab-disc i:nth-child(3){left:76%;animation-delay:.66s;}
@keyframes ufoLights{50%{opacity:.25;}}
.ab-beam{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:120px;height:0;z-index:-1;
  background:linear-gradient(180deg,rgba(150,255,190,.5),rgba(150,255,190,.06));
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);transition:height .5s ease;}
.ab-ufo.beaming .ab-beam{height:270px;animation:beamPulse .5s ease-in-out infinite;}
@keyframes beamPulse{50%{opacity:.55;}}
.ab-rise{animation:abRise 2.6s ease-in forwards !important;z-index:8;}
@keyframes abRise{to{transform:translateY(-300px) rotate(720deg) scale(.3);opacity:0;}}
.ab-ufo.gone{transition:left .7s cubic-bezier(.6,0,1,1), top .7s;left:120%!important;top:-20%;}

/* --- 🎯 el dardo --- */
.dd-wrap{position:relative;width:min(560px,92vw);}
.dd-board{position:relative;width:100%;aspect-ratio:1.5;border-radius:18px;padding:26px;
  background:radial-gradient(circle at 30% 25%, #B98B54, #96683A 55%, #7A5228);
  box-shadow:inset 0 0 50px rgba(0,0,0,.45), 0 24px 50px -16px rgba(0,0,0,.7);
  border:10px solid #4C3218;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;}
.dd-pin{position:relative;}
.dd-pin::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f66,#a11);z-index:5;box-shadow:0 2px 3px rgba(0,0,0,.5);}
.dd-cross{position:absolute;z-index:8;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;
  border:2px solid rgba(224,74,58,.9);border-radius:50%;transition:left .18s, top .18s;
  box-shadow:0 0 14px rgba(224,74,58,.4);}
.dd-cross::before,.dd-cross::after{content:'';position:absolute;background:rgba(224,74,58,.9);}
.dd-cross::before{left:50%;top:-8px;bottom:-8px;width:2px;transform:translateX(-50%);}
.dd-cross::after{top:50%;left:-8px;right:-8px;height:2px;transform:translateY(-50%);}
.dd-dart{position:absolute;z-index:9;font-size:52px;transform:translate(-50%,-50%) scale(3) rotate(-45deg);opacity:0;pointer-events:none;}
.dd-dart.fly{animation:dartFly .5s cubic-bezier(.5,0,.8,1) forwards;}
@keyframes dartFly{0%{opacity:0;transform:translate(-50%,-50%) scale(3.4) rotate(-45deg);}30%{opacity:1;}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-45deg);}}
.dd-dart.stuck{animation:dartWobble .5s ease-out;}
@keyframes dartWobble{0%{transform:translate(-50%,-50%) rotate(-45deg);}30%{transform:translate(-50%,-52%) rotate(-40deg);}60%{transform:translate(-50%,-49%) rotate(-48deg);}100%{transform:translate(-50%,-50%) rotate(-45deg);}}
/* ============================================================
   ESTADÍSTICAS — editorial, no planilla
   ============================================================ */
.st-wrap{margin-top:30px;display:flex;flex-direction:column;gap:54px;}
.st-sec{position:relative;}
.st-h{
  display:flex;align-items:baseline;gap:14px;margin:0 0 22px;
  font-family:'Fraunces',serif;font-weight:800;font-size:clamp(19px,2.6vw,25px);
  letter-spacing:-.01em;color:var(--bone);
}
.st-h em{font-style:normal;font-size:26px;filter:saturate(.9);}
.st-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.st-note{font-size:12.5px;color:var(--grey);font-style:italic;margin-top:-14px;margin-bottom:18px;}

/* — cifras: el corazón del look — */
.st-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--border-soft);border-radius:14px;overflow:hidden;}
.st-fig{background:#0A130B;padding:18px 18px 16px;min-height:104px;
  display:flex;flex-direction:column;justify-content:flex-start;transition:background .25s;}
.st-fig:hover{background:#0E1A10;}
.st-fig .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);font-weight:600;}
.st-fig .v{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(26px,3.4vw,36px);
  line-height:1;margin-top:9px;color:var(--bone);letter-spacing:-.02em;}
.st-fig .v.am{color:var(--amber);}
.st-fig .v.sm{font-size:19px;line-height:1.15;}
.st-fig .u{font-size:11.5px;color:var(--bone-dim);margin-top:6px;line-height:1.35;}
.st-fig .u b{color:var(--amber);font-weight:600;}

/* — el marcador — */
.st-score{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;
  border-radius:18px;overflow:hidden;border:1px solid var(--border-soft);
  background:#080F09;
}
.st-team{position:relative;padding:26px 22px;text-align:center;overflow:hidden;}
.st-team::before{content:'';position:absolute;inset:0;opacity:.1;
  background:radial-gradient(90% 90% at 50% 110%, var(--pc), transparent 70%);}
.st-team.lead::before{opacity:.22;}
.st-tname{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--pc);font-weight:600;}
.st-tnum{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(54px,10vw,86px);
  line-height:.95;color:var(--pc);letter-spacing:-.03em;margin-top:6px;
  text-shadow:0 0 40px color-mix(in srgb,var(--pc) 35%,transparent);}
.st-mid{padding:0 6px;text-align:center;}
.st-mid span{font-family:'Fraunces',serif;font-weight:900;font-size:16px;color:var(--grey);display:block;}
.st-mid small{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);opacity:.6;}
.st-band{
  margin-top:10px;padding:12px 18px;border-radius:12px;
  background:linear-gradient(90deg, rgba(201,248,57,.09), rgba(201,248,57,.02));
  border-left:2px solid var(--amber);font-size:13px;color:var(--bone-dim);
}
.st-band.gold{background:linear-gradient(90deg, rgba(232,195,74,.1), rgba(232,195,74,.02));border-left-color:#E8C34A;}
.st-band b{color:var(--bone);font-weight:600;}

/* — versus rows (rescatista, traiciones…) — */
.st-vs-rows{display:flex;flex-direction:column;}
.st-vs-row{display:grid;grid-template-columns:1fr 128px 1fr;align-items:center;gap:14px;
  padding:13px 0;border-top:1px solid rgba(30,61,38,.4);}
.st-vs-row:first-child{border-top:none;}
.st-vs-n{font-family:'Fraunces',serif;font-weight:900;font-size:23px;line-height:1;}
.st-vs-n.l{text-align:right;color:var(--pa);}
.st-vs-n.r{text-align:left;color:var(--pb);}
.st-vs-lab{text-align:center;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);font-weight:600;}
.st-vs-meter{grid-column:1/-1;height:3px;border-radius:2px;background:var(--pb);overflow:hidden;margin-top:-4px;}
.st-vs-meter i{display:block;height:100%;background:var(--pa);transition:width .9s cubic-bezier(.22,.9,.26,1);}

/* — barras — */
.st-bars{display:flex;flex-direction:column;gap:12px;}
.st-bar{display:grid;grid-template-columns:1fr auto;gap:4px;}
.st-bar .stb-h{display:flex;justify-content:space-between;align-items:baseline;grid-column:1/-1;}
.st-bar .stb-l{font-size:12.5px;color:var(--bone);text-transform:capitalize;}
.st-bar .stb-n{font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--grey);}
.st-bar .stb-t{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(30,61,38,.55);overflow:hidden;}
.st-bar .stb-t{position:relative;}
.st-bar .stb-f{display:block;height:100%;border-radius:2px;width:0;
  background:linear-gradient(90deg, color-mix(in srgb,var(--bc,var(--amber)) 55%, transparent), var(--bc,var(--amber)));
  box-shadow:0 0 10px -3px var(--bc,var(--amber));
  transition:width .95s cubic-bezier(.22,.9,.26,1);}
.st-bar.top .stb-l{color:var(--amber);font-weight:600;}

/* ── entrada coreografiada: cada bloque y sus hijos suben al entrar en pantalla ── */
.st-rv{opacity:0;transform:translateY(24px);
  transition:opacity .62s var(--ease-out), transform .62s var(--ease-out);}
.st-rv.in{opacity:1;transform:none;}
.st-rvc{opacity:0;transform:translateY(16px);
  transition:opacity .5s var(--ease-out), transform .5s var(--ease-out);}
.st-rvc.in{opacity:1;transform:none;}
.st-count{font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:reduce){
  .st-rv,.st-rvc{opacity:1 !important;transform:none !important;transition:none !important;}
}

/* — récords / salón de la fama — */
.st-recs{display:flex;flex-direction:column;}
.st-rec{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid rgba(30,61,38,.4);}
.st-rec:first-child{border-top:none;}
.st-rico{font-size:24px;flex:none;width:32px;text-align:center;opacity:.9;}
.st-rmain{flex:1;min-width:0;}
.st-rlab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);font-weight:600;}
.st-rval{font-family:'Fraunces',serif;font-weight:700;font-size:16px;line-height:1.15;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-rsub{font-size:11.5px;color:var(--bone-dim);margin-top:2px;}
.st-rcov{width:34px;height:51px;border-radius:3px;flex:none;background-size:cover;background-position:center;
  background-color:var(--card-hi);box-shadow:0 5px 12px rgba(0,0,0,.55);}

/* — tropes — */
.st-chips{display:flex;flex-wrap:wrap;gap:8px;}
.st-chip{
  font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--border-soft);
  color:var(--bone-dim);display:inline-flex;align-items:center;gap:7px;transition:.2s;
}
.st-chip b{color:var(--grey);font-weight:600;font-size:10.5px;}
.st-chip.hot{border-color:rgba(201,248,57,.35);background:rgba(201,248,57,.06);color:var(--bone);}
.st-chip.hot b{color:var(--amber);}
.st-chip.cand{border-color:rgba(232,195,74,.35);color:#E8C34A;background:rgba(232,195,74,.05);}
.st-chip.big{font-size:14px;padding:8px 16px;}

/* — geo — */
.st-geo{display:flex;flex-direction:column;gap:11px;}
.st-geo-row{display:flex;align-items:center;gap:11px;}
.st-flag{font-size:17px;flex:none;width:24px;}
.st-geo-name{flex:none;width:120px;font-size:12.5px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-geo-bar{flex:1;height:4px;border-radius:2px;background:rgba(30,61,38,.55);overflow:hidden;}
.st-geo-bar i{display:block;height:100%;background:var(--amber);border-radius:2px;width:0;transition:width 1s var(--ease-out);}
.st-geo-n{font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--grey);width:24px;text-align:right;}

/* — ribbon de géneros (reemplaza el donut) — */
.st-ribbon{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(30,61,38,.5);}
.st-ribbon i{display:block;height:100%;transition:width 1s var(--ease-out);width:0;}
.st-rleg{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;}
.st-rleg div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bone-dim);}
.st-rleg i{width:8px;height:8px;border-radius:2px;display:block;flex:none;}

/* — autoría: balanza — */
.st-scale{display:flex;align-items:center;gap:0;height:52px;border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);}
.st-scale div{display:flex;align-items:center;justify-content:center;gap:9px;height:100%;transition:width 1s var(--ease-out);}
.st-scale .f{background:linear-gradient(90deg, rgba(201,248,57,.25), rgba(201,248,57,.14));color:var(--bone);}
.st-scale .m{background:rgba(30,61,38,.4);color:var(--bone-dim);}
.st-scale b{font-family:'Fraunces',serif;font-weight:900;font-size:19px;}
.st-scale span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;}

/* — línea de tiempo de publicación (HORIZONTAL, deslizable, interactiva) — */
.st-htl{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:6px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.st-htl::-webkit-scrollbar{height:6px;}
.st-htl::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.st-htl-era{flex:none;align-self:stretch;display:flex;align-items:flex-end;padding:0 6px 24px 8px;
  border-left:1px solid var(--border);margin-left:2px;
  font-family:'Inter';font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);white-space:nowrap;}
.st-htl-item{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;color:inherit;cursor:pointer;padding:0;scroll-snap-align:center;
  transition:.15s var(--ease-pop);}
.st-htl-item:hover{transform:translateY(-3px);}
.st-htl-cover{width:52px;height:76px;border-radius:5px;background-size:cover;background-position:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);border-bottom:3px solid var(--pc,var(--grey));}
.st-htl-year{font-family:'Fraunces',serif;font-weight:700;font-size:12px;color:var(--bone-dim);}

/* — 🏟️ Gran Vasallaje (32/64) — */
.vsm-big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto 0;}
@media (max-width:560px){ .vsm-big{grid-template-columns:1fr;} }
.vsm-bigcard{display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;
  background:linear-gradient(160deg,rgba(232,195,74,.1),rgba(15,25,16,.6));
  border:1px solid rgba(232,195,74,.35);border-radius:16px;padding:16px 18px;color:inherit;transition:.2s var(--ease-pop);}
.vsm-bigcard:hover{transform:translateY(-2px);border-color:#E8C34A;}
.vsm-bigcard.dim,.vsm-bigcard.lock{opacity:.5;cursor:not-allowed;background:rgba(15,25,16,.5);border-color:var(--border);}
.vsm-bigico{font-size:24px;}
.vsm-bigt{font-family:'Fraunces',serif;font-weight:800;font-size:19px;color:#E8C34A;}
.vsm-bigd{font-size:12.5px;color:var(--bone-dim);line-height:1.4;}
/* ruleta horizontal de exclusión */
.gr-reel-wrap{position:relative;width:min(96vw,760px);margin:22px auto 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
.gr-reel{display:flex;gap:8px;overflow-x:auto;padding:8px 40%;scrollbar-width:none;}
.gr-reel::-webkit-scrollbar{display:none;}
.gr-cell{flex:none;width:56px;height:82px;border-radius:6px;background-size:cover;background-position:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);transition:.18s;opacity:.85;}
.gr-cell.lit{outline:3px solid #E8C34A;outline-offset:2px;transform:scale(1.08);opacity:1;}
.gr-cell.out{opacity:.25;filter:grayscale(1);transform:scale(.9);position:relative;}
/* cruces del torneo — ficha completa, una a la izquierda y otra a la derecha */
.gr-matches{display:flex;flex-direction:column;gap:14px;width:min(96vw,720px);margin:20px auto 0;}
.gr-match{display:flex;align-items:stretch;gap:10px;}
.gr-match .gr-vs{align-self:center;font-family:'Fraunces',serif;font-style:italic;color:var(--grey);font-size:15px;flex:none;}
.gr-side{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px;cursor:pointer;text-align:left;
  background:linear-gradient(160deg,rgba(15,25,16,.7),rgba(7,12,8,.82));border:1.5px solid var(--border-soft);
  border-radius:14px;color:inherit;transition:.16s var(--ease-pop);}
.gr-side.right{flex-direction:row-reverse;text-align:right;}
.gr-side.blind{align-items:center;justify-content:center;text-align:center;min-height:150px;}
.gr-blind-q{font-family:"newsreader",'Georgia',serif;font-style:italic;font-size:clamp(15px,2.4vw,20px);line-height:1.4;color:var(--bone);opacity:.94;}
.gr-side:hover{border-color:#E8C34A;transform:translateY(-1px);}
.gr-cover{flex:none;width:56px;height:82px;border-radius:6px;background-size:cover;background-position:center;
  box-shadow:0 3px 10px rgba(0,0,0,.5);}
.gr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.gr-t{font-family:'Fraunces',serif;font-weight:800;font-size:15px;line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gr-meta{font-size:10.5px;color:var(--amber-soft);letter-spacing:.02em;}
.gr-syn{font-family:'Fraunces',serif;font-style:italic;font-size:11.5px;color:var(--bone-dim);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.gr-tropes{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
.gr-side.right .gr-tropes{justify-content:flex-end;}
.gr-tropes i{font-style:normal;font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:999px;color:var(--bone-dim);white-space:nowrap;}
.gr-match.done .gr-side{cursor:default;}
.gr-side.win{border-color:#E8C34A;background:linear-gradient(160deg,rgba(232,195,74,.18),rgba(15,25,16,.7));box-shadow:0 0 18px -6px #E8C34A;}
.gr-side.lose{opacity:.4;filter:grayscale(.6);}
@media (max-width:560px){
  .gr-match{flex-direction:column;gap:8px;}
  .gr-side, .gr-side.right{flex-direction:row;text-align:left;}
  .gr-side.right .gr-tropes{justify-content:flex-start;}
  .gr-match .gr-vs{align-self:center;padding:2px 0;}
}
.st-duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:6px;}
.st-duel-s{text-align:center;}
.st-duel-y{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(28px,4.5vw,40px);color:var(--pc);line-height:1;}
.st-duel-n{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-top:5px;}
.st-duel-mid{width:1px;height:44px;background:var(--border);}

/* — invisibles — */
.st-inv{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.st-invside .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:12px;}
.st-invbooks{display:flex;gap:14px;}
.st-invb{text-align:center;width:66px;cursor:pointer;transition:.25s;}
.st-invb:hover{transform:translateY(-4px);}
.st-invb .mini-book{filter:grayscale(.75) brightness(.6);transition:.25s;}
.st-invb:hover .mini-book{filter:grayscale(0) brightness(1);}
.st-invt{font-size:9.5px;color:var(--grey);margin-top:7px;line-height:1.2;}

/* — timeline de cosechas — */
.st-tl{display:flex;flex-direction:column;}
.st-tlrow{display:flex;gap:18px;align-items:center;padding:16px 0;border-top:1px solid rgba(30,61,38,.4);}
.st-tlrow:first-child{border-top:none;}
.st-tldate{width:92px;flex:none;font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--grey);}
.st-tlcov{width:36px;height:54px;border-radius:3px;flex:none;background-size:cover;background-position:center;
  background-color:var(--card-hi);box-shadow:0 6px 14px rgba(0,0,0,.55);}
.st-tlmain{flex:1;min-width:0;}
.st-tlwin{font-family:'Fraunces',serif;font-weight:700;font-size:16px;line-height:1.2;}
.st-tlmeta{font-size:11.5px;color:var(--grey);margin-top:4px;}
.st-hint{font-size:12px;color:var(--grey);font-style:italic;}

@media (max-width:700px){
  .st-figs{grid-template-columns:repeat(2,1fr);}
  .st-inv{grid-template-columns:1fr;}
  .st-vs-row{grid-template-columns:1fr 92px 1fr;gap:8px;}
  .st-geo-name{width:84px;}
}

/* ============================================================
   VASALLAJE — selector de modos
   ============================================================ */
/* el lugar del torneo: editable arriba de los modos, y mostrado en el cuadro */
.vsm-lugar{display:inline-flex;align-items:center;gap:8px;margin:14px auto 0;padding:8px 14px;
  background:rgba(232,195,74,.06);border:1px solid rgba(232,195,74,.22);border-radius:999px;
  transition:border-color .18s,background .18s;}
.vsm-lugar:focus-within{border-color:rgba(232,195,74,.5);background:rgba(232,195,74,.1);}
.vsm-lugar span{font-size:14px;opacity:.85;}
.vsm-lugar input{background:transparent;border:none;outline:none;color:var(--bone);
  font-family:'Inter',sans-serif;font-size:13.5px;width:min(260px,60vw);text-align:center;}
.vsm-lugar input::placeholder{color:var(--bone-dim);opacity:.7;}
.vs-lugar{font-size:12.5px;color:#E8C34A;letter-spacing:.03em;margin-top:6px;opacity:.9;}
@media (hover:none){ .vsm-lugar{padding:11px 16px;} .vsm-lugar input{font-size:15px;} }

.vsm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px;}
.vsm-card{
  position:relative;overflow:hidden;cursor:pointer;text-align:left;
  background:linear-gradient(165deg, rgba(20,32,20,.85), rgba(9,15,10,.92));
  border:1.5px solid var(--border);border-radius:18px;padding:22px 20px;
  transition:transform .25s var(--ease-pop), border-color .25s, box-shadow .25s;
  opacity:0;animation:rise .5s var(--ease-out) forwards;animation-delay:calc(var(--i,0)*70ms);
}
.vsm-card::after{content:'';position:absolute;inset:0;opacity:0;transition:.25s;
  background:radial-gradient(80% 70% at 50% 0%, rgba(232,195,74,.16), transparent 70%);}
.vsm-card:hover{transform:translateY(-5px);border-color:#E8C34A;box-shadow:0 20px 44px -20px rgba(232,195,74,.5);}
.vsm-card:hover::after{opacity:1;}
.vsm-n{font-family:'Fraunces',serif;font-weight:900;font-size:13px;color:#E8C34A;letter-spacing:.1em;}
.vsm-ico{font-size:30px;margin:8px 0 10px;line-height:1;}
.vsm-t{font-family:'Fraunces',serif;font-weight:800;font-size:18px;line-height:1.15;}
.vsm-d{font-size:12px;color:var(--bone-dim);margin-top:7px;line-height:1.45;}
.vsm-card.dim{opacity:.35;pointer-events:none;filter:grayscale(.6);}
.vsm-warn{font-size:10.5px;color:var(--danger);margin-top:8px;}

/* sorteo de trope: una sola ventana, un solo trope */
.vt-slot{
  position:relative;width:min(760px,94vw);border-radius:26px;padding:44px 30px 40px;
  background:linear-gradient(158deg, var(--card-hi) 0%, var(--card) 55%, var(--bg) 100%);
  border:1.5px solid rgba(232,195,74,.32);
  box-shadow:0 34px 70px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(232,195,74,.14);
  overflow:hidden;text-align:center;
}
.vt-slot::after{content:'';position:absolute;top:-45%;left:50%;transform:translateX(-50%);
  width:80%;height:150%;pointer-events:none;
  background:radial-gradient(circle, rgba(232,195,74,.14), transparent 62%);}
.vt-slot.done{border-color:rgba(232,195,74,.6);box-shadow:0 34px 70px -26px rgba(0,0,0,.85), 0 0 42px -6px rgba(232,195,74,.28);}
.vt-lab{position:relative;z-index:1;font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--grey);font-weight:700;}
.vt-win{
  position:relative;z-index:1;
  font-family:'Fraunces',serif;font-weight:900;color:var(--bone);line-height:1.05;margin:22px 0 26px;
  font-size:clamp(30px,6vw,58px);min-height:1.1em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-shadow:0 6px 26px rgba(0,0,0,.6);
}
.vt-slot.done .vt-win{color:#E8C34A;text-shadow:0 0 34px rgba(232,195,74,.35);}
.vt-win.spin{opacity:.72;filter:blur(.5px);}
.vt-win small{display:block;font-family:'Inter';font-size:13px;font-weight:500;
  color:var(--grey);margin-top:14px;letter-spacing:.04em;}
.vt-go{
  position:relative;z-index:1;
  font-family:'Inter';font-weight:700;font-size:16px;border:none;cursor:pointer;
  background:var(--amber);color:#0A1209;border-radius:999px;padding:16px 40px;
  box-shadow:0 12px 26px -8px rgba(201,248,57,.5);transition:.25s var(--ease-pop);
}
.vt-go:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 18px 34px -8px rgba(201,248,57,.7);}
.vt-go:disabled{opacity:.4;cursor:default;transform:none;}
.vt-taken{position:relative;z-index:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.vt-taken span{
  font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:#E8C34A;
  background:rgba(232,195,74,.08);border:1px solid rgba(232,195,74,.32);
  border-radius:999px;padding:7px 16px;
}
.vt-taken span b{color:var(--grey);font-weight:600;margin-left:7px;}
/* la tarjeta que el azar va iluminando cuando elige el modo */
.vsm-card.lit{border-color:#E8C34A;transform:translateY(-5px) scale(1.02);
  box-shadow:0 22px 46px -18px rgba(232,195,74,.6);}
.vsm-card.lit::after{opacity:1;}

/* ---- A CIEGAS: el cuadro entero son frases ---- */
.vs-node.blind .vsn-cover{
  width:132px;height:82px;border-radius:10px;padding:9px 10px;
  background:linear-gradient(160deg, #1B2A20, #101A13);
  border:1px solid rgba(232,195,74,.28);
  display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.55);
}
.vs-node.blind.champ .vsn-cover{width:168px;height:104px;}
.vsn-q{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:9.5px;line-height:1.35;color:var(--bone);}
.vs-node.blind.champ .vsn-q{font-size:11.5px;}
.vs-node.blind .vsn-lab{display:none;}
/* alegato a ciegas */
.vq-duel{display:flex;align-items:stretch;gap:clamp(14px,3vw,34px);justify-content:center;}
.vq-side{
  flex:1;max-width:300px;min-height:190px;padding:26px 22px;border-radius:18px;
  background:linear-gradient(160deg, var(--card-hi), var(--card) 60%);
  border:1.5px solid var(--border);display:flex;flex-direction:column;
}
.vq-mark{font-family:'Fraunces',serif;font-size:34px;color:#E8C34A;opacity:.5;line-height:.6;}
.vq-text{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(16px,2.3vw,21px);line-height:1.45;color:var(--bone);margin:12px 0 auto;}
.vq-foot{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-top:16px;}
.vq-reveal{display:flex;flex-direction:column;align-items:center;gap:14px;}
/* la lista de revelación final */
.vqr-list{display:flex;flex-direction:column;gap:0;width:min(720px,94vw);margin:0 auto;text-align:left;}
.vqr-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid rgba(30,61,38,.4);}
.vqr-row:first-child{border-top:none;}
.vqr-row.win{background:linear-gradient(90deg, rgba(232,195,74,.09), transparent);border-radius:10px;padding-left:12px;}
.vqr-cov{width:38px;height:57px;border-radius:3px;flex:none;background-size:cover;background-position:center;
  background-color:var(--card-hi);box-shadow:0 6px 14px rgba(0,0,0,.55);}
.vqr-main{flex:1;min-width:0;}
.vqr-q{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--bone-dim);}
.vqr-t{font-family:'Fraunces',serif;font-weight:700;font-size:15.5px;margin-top:4px;}
.vqr-t b{color:#E8C34A;font-weight:700;}
.vqr-sub{font-size:11px;color:var(--grey);margin-top:2px;}

/* sinopsis en los alegatos (modos con libro a la vista) */
.vs-duel-syn{
  font-size:12.5px;line-height:1.6;color:var(--bone-dim);margin-top:11px;
  height:96px;overflow-y:auto;padding:11px 12px;text-align:left;
  background:rgba(0,0,0,.28);border:1px solid var(--border-soft);border-radius:12px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.vs-duel-syn::-webkit-scrollbar{width:5px;}
.vs-duel-syn::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* ⚔️ alegatos: cada libro es una FILA horizontal — portada al lado de la info,
   no debajo. Los dos libros se apilan; el «vs» queda entre las dos filas. */
.vs-duel:not(.epic){flex-direction:column;align-items:center;gap:15px;}
.vs-duel:not(.epic) .vs-duel-side{width:100%;max-width:500px;align-items:stretch;}
.vs-duel:not(.epic) .vs-duel-body{display:flex;flex-direction:row;align-items:flex-start;gap:16px;width:100%;}
.vs-duel:not(.epic) .vs-duel-side.right .vs-duel-body{flex-direction:row-reverse;}
.vs-duel:not(.epic) .vs-duel-cover{flex:none;height:auto;margin-top:0;}
.vs-duel:not(.epic) .vs-duel-info{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;}
.vs-duel:not(.epic) .vs-duel-side.right .vs-duel-info{text-align:right;}
.vs-duel:not(.epic) .vs-duel-title{text-align:inherit;justify-content:flex-start;min-height:auto;margin-top:2px;font-size:17px;}
.vs-duel:not(.epic) .vs-duel-side.right .vs-duel-title{justify-content:flex-end;}
.vs-duel:not(.epic) .vs-duel-tropes{justify-content:flex-start;height:auto;margin-top:7px;}
.vs-duel:not(.epic) .vs-duel-side.right .vs-duel-tropes{justify-content:flex-end;}
.vs-duel:not(.epic) .vs-duel-syn{height:auto;max-height:128px;margin-top:9px;}
.vs-duel:not(.epic) .vs-duel-go{align-self:center;margin-top:14px;}
.vs-duel:not(.epic) .vs-vs{margin:0 auto;}

/* el VS épico arma su propio duelo: ahí el «vs» sí va al centro */
.vs-duel.epic{align-items:center;}
.vs-duel.epic .vs-vs{margin-top:0;}
@media (max-width:600px){
  .vs-duel{flex-direction:column;align-items:center;--dcH:150px;}
  .vs-duel-side{width:min(280px,86vw);max-width:86vw;}
  .vs-vs{margin-top:0;}
}

/* random total: criterio bajo cada libro */
.vr-grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:10px;}
.vr-item{display:flex;flex-direction:column;align-items:center;gap:9px;width:118px;
  opacity:0;animation:rise .55s var(--ease-out) forwards;animation-delay:calc(var(--i,0)*80ms);}
.vr-tag{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;
  padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--grey);
}
.vr-tag.crit{border-color:rgba(201,248,57,.4);color:var(--amber);background:rgba(201,248,57,.06);}
.vr-tag.none{border-color:rgba(242,245,236,.12);color:var(--grey);opacity:.7;}
.vr-t{font-size:10.5px;color:var(--bone-dim);text-align:center;line-height:1.2;}

/* ====== responsive ====== */
@media (max-width:840px){
  .upload-grid{grid-template-columns:1fr;}
  .deck-arrow.left{left:6px;top:auto;bottom:-66px;transform:none;}
  .deck-arrow.right{right:6px;top:auto;bottom:-66px;transform:none;}
  .deck-arrow:hover{transform:scale(1.1);}
  .deck-tabs{margin-top:20px;}
  .dossier{padding:28px 24px 24px;}
  .wrap{padding:52px 20px 80px;}
  .fb-lab{display:none;}
  .fb-step.act .fb-lab{display:block;}
  .game-grid{grid-template-columns:repeat(2,1fr);}
  .ttt-board{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);}
  .ttt-cell{width:60px;height:60px;font-size:30px;}
  .shifumi{gap:8px;}
  .sf-side{min-width:0;}
  .sf-hand{font-size:44px;}
  .placard{flex-direction:column;gap:18px;padding:22px;overflow-y:auto;max-height:92vh;}
  .pl-cover{width:min(240px,64vw);}
  .pl-arrow.prev{left:6px;} .pl-arrow.next{right:6px;}
  .section-head{flex-direction:column;align-items:flex-start;}
}
/* botones táctiles de los juegos de teclas (sirven en teléfono y en compu) */
.sf-tap{display:flex;gap:8px;justify-content:center;margin-top:12px;}
.sf-tap button{
  width:46px;height:46px;border-radius:12px;font-size:22px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--border);transition:.15s;
}
.sf-tap button:active, .sf-tap button.on{border-color:var(--amber);background:rgba(201,248,57,.12);transform:scale(1.08);}
.soga-tap{display:flex;gap:14px;justify-content:center;margin-top:16px;}
.soga-btn{
  flex:1;max-width:240px;padding:20px 12px;border-radius:16px;cursor:pointer;
  font-family:"sztos-variable",'Inter',sans-serif;font-variation-settings:"wght" 800,"wdth" 108;
  font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:#0A1209;
  background:var(--pc,var(--amber));border:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  box-shadow:0 8px 20px -8px color-mix(in srgb, var(--pc,#888) 60%, transparent);
}
.soga-btn.hit{animation:sogaHit .16s ease;}
@keyframes sogaHit{50%{transform:scale(.93);}}

/* ============================================================
   📱 MOBILE — la app en el bolsillo, pensada para el pulgar
   ============================================================ */
/* touch (sin hover): la X de borrar NO vive visible en mobile.
   En el celu se borra desde adentro de la ficha del libro (botón 🗑). */
@media (hover: none){
  .vault-slot .del-x{display:none;}
  /* nada de estados :hover que se quedan pegados al tocar */
  .btn:hover, .load-btn:hover, .game-tile:hover, .rz-premio:hover,
  .carta.mini:hover, .foto-thumb:hover, .rec-card:hover{transform:none;}
}

@media (max-width:560px){
  .wrap{padding:36px 16px 96px;}
  h1.title{font-size:clamp(34px,10vw,50px);}
  .lead{font-size:14.5px;}
  .mt-l{margin-top:34px;}
  .mt-m{margin-top:22px;}

  /* todo lo tocable, con área de pulgar (mín. 44px de alto) */
  .btn{padding:15px 26px;font-size:15px;}
  .btn-sm{padding:12px 20px;font-size:13.5px;}
  .load-btn{padding:12px 16px;font-size:13px;}
  .vf-lens, .vf-pop button{padding:13px 15px;}
  .pl2-tool{padding:7px 7px 7px 8px;}
  .pt-pick{width:30px;height:30px;}
  .tpl-link{padding:6px 0;display:inline-block;}

  /* las filas de acciones: full-width, cada botón crece parejo */
  .home-load{width:100%;gap:8px;}
  .home-load .load-btn{flex:1 1 auto;justify-content:center;min-width:44%;}
  .section-head{flex-direction:column;align-items:stretch;gap:12px;}
  .section-head > div:first-child{text-align:left;}

  /* la barra de la cosecha: nombres, lugar, temática y foto apilados y anchos */
  .names{flex-direction:column;align-items:stretch !important;gap:12px !important;}
  .names > span, .names > label{justify-content:flex-start;}
  .names .ninput{width:100% !important;}
  #temaEmoji{width:64px !important;flex:none;}
  .foto-pick{width:100%;flex-wrap:wrap;}

  /* overlays y ventanitas: respiran hasta los bordes */
  .overlay{padding:18px 14px;}
  .ov-pop{max-width:100% !important;width:100%;}
  .ov-pop.placard2, .pl2-frame{width:100%;}

  /* el selector de juegos y las apuestas: 2 columnas justas */
  .game-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .gt-name{font-size:13.5px;}
  .gt-desc{font-size:11px;}
  .ap-grid{gap:14px;}
  .ap-item{padding:8px;}

  /* recuerdos: la mesa un poco más baja para que entre en pantalla */
  .rec-board{height:58vh;}

  /* la ceremonia del final y los duelos ya apilan; achico estrellas */
  .rate-stars.big{font-size:34px;letter-spacing:4px;}
  .fin-name{min-width:56px;font-size:12px;}

  /* el mazo y la carta grande caben */
  .carta{width:min(74vw,240px);height:auto;aspect-ratio:190/288;}
  .mazo-fila{gap:12px;}

  /* botones flotantes: un toque más grandes y separados del borde */
  #muteBtn{width:44px;height:44px;top:12px;right:12px;}
  #resetBtn, #abortBtn{padding:9px 15px;font-size:12px;opacity:.75;}

  /* el wrapped: la cifra gigante que no reviente */
  .rz-big{font-size:clamp(54px,20vw,110px);}
  .rz-podio{gap:12px;}
  .rz-premio{min-width:100%;max-width:100%;}

  /* sync */
  .sync-card{flex-direction:column;align-items:stretch;gap:14px;}
  .sync-actions{width:100%;}
  .sync-actions .load-btn{flex:1;justify-content:center;}
}

/* pantallitas muy chicas (iPhone SE y menores) */
@media (max-width:360px){
  .game-grid{grid-template-columns:1fr;}
  h1.title{font-size:clamp(30px,11vw,42px);}
}

@media (prefers-reduced-motion: reduce){
  #grain{animation:none;}
